          }
          ENDOFFILE
          cat > DemoBot/gradle.properties <<'ENDOFFILE'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          ENDOFFILE
          cat > DemoBot/settings.gradle.kts <<'ENDOFFILE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "DemoBot"
          include(":app")
          ENDOFFILE
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Accept licenses and install SDK
        run: |
          SDKM=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "platforms;android-34" "build-tools;34.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        working-directory: DemoBot
        run: gradle assembleDebug --stacktrace
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" DemoBot/app/build/outputs/apk/debug/app-debug.apk --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "v0.5 自动开页+走势图 #${{ github.run_number }}" --notes "版本0.5"
