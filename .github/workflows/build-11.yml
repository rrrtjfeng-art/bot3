          mkdir -p DemoBot/app/src/main/java/com/example/demobot
          cat > DemoBot/app/src/main/java/com/example/demobot/Bot.kt <<'ENDOFFILE'
          package com.example.demobot

          /** 全局状态机。不会自动恢复：重启后一律 IDLE。 */
          object Bot {
              enum class State { IDLE, OBSERVING, PAPER, SAFE_STOP }

              const val DEMO_MODE_LOCK = true   // 禁止真实账户/真实交易

              @Volatile var state = State.IDLE
              @Volatile var targetPackage = ""
              @Volatile var foreground = ""
              @Volatile var stopReason = ""

              fun start(pkg: String): Boolean {
                  if (state != State.IDLE || pkg.isBlank()) return false
                  targetPackage = pkg.trim()
                  state = State.OBSERVING
                  BotLog.i("开始观察: $targetPackage")
                  return true
              }

              /** 纸上交易：只读价格、只做判断和假想成交，不点击任何东西 */
              fun startPaper(pkg: String): Boolean {
                  if (state != State.IDLE) { BotLog.w("当前状态是$state，请先点停止或确认恢复"); return false }
                  if (pkg.isBlank()) return false
                  targetPackage = pkg.trim()
                  Paper.reset()
                  state = State.PAPER
                  BotLog.i("开始纸上交易(不点击): $targetPackage")
                  return true
              }

              fun stop() {
                  state = State.IDLE
                  BotLog.i("用户停止")
              }

              fun safeStop(reason: String) {
                  state = State.SAFE_STOP
                  stopReason = reason
                  BotLog.w("SAFE_STOP: $reason")
              }

              fun confirmRecover() {
                  if (state == State.SAFE_STOP) { state = State.IDLE; stopReason = ""; BotLog.i("用户确认恢复") }
              }
          }
          ENDOFFILE
          mkdir -p DemoBot/app/src/main/java/com/example/demobot
          cat > DemoBot/app/src/main/java/com/example/demobot/BotAccessibilityService.kt <<'ENDOFFILE'
          package com.example.demobot

          import android.accessibilityservice.AccessibilityService
          import android.os.Handler
          import android.os.Looper
          import android.os.SystemClock
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo

          /**
           * 纸上交易：每秒读取MT5订单页的买卖价。
           * 会自动"点击导航"打开订单页，但只允许点白名单里的两个控件(打开订单页/切到图表)，
           * 绝不点击 买入/卖出/下单/平仓 等任何交易按钮。
           */
          class BotAccessibilityService : AccessibilityService() {
              companion object { @Volatile var instance: BotAccessibilityService? = null }

              private val navAllowed = setOf("menu_chart_new_limit_order", "bottom_bar_chart")
              private var lastNav = 0L
              private var navFails = 0
              private var lastDump = 0L
              private var lastSeenPkg = ""
              private val handler = Handler(Looper.getMainLooper())

              private val ticker = object : Runnable {
                  override fun run() {
                      try {
                          if (Bot.state == Bot.State.PAPER) readTick()
                      } catch (e: Exception) {
                          BotLog.w("读取错误: " + e.message)
                      }
                      handler.postDelayed(this, 1000)
                  }
              }

              override fun onServiceConnected() {
                  instance = this
                  BotLog.init(this)
                  Cfg.init(this)
                  BotLog.i("无障碍服务已连接")
                  handler.removeCallbacks(ticker)
                  handler.postDelayed(ticker, 1000)
              }

              private fun textOf(root: AccessibilityNodeInfo, id: String): String? {
                  val list = root.findAccessibilityNodeInfosByViewId(Bot.targetPackage + ":id/" + id)
                  if (list == null || list.isEmpty()) return null
                  return list[0].text?.toString()
              }

              private fun num(s: String?): Double? {
                  if (s == null) return null
                  return s.replace(Regex("[\\s\\u00A0\\u202F,]"), "").toDoubleOrNull()
              }

              /** 找到MT5的窗口(支持分屏/小窗：不要求MT5是当前焦点窗口) */
              private fun mt5Root(): AccessibilityNodeInfo? {
                  try {
                      for (w in windows) {
                          val r = w.root
                          if (r != null && r.packageName?.toString() == Bot.targetPackage) return r
                      }
                  } catch (e: Exception) {
                      BotLog.w("读取窗口列表失败: " + e.message)
                  }
                  val r = rootInActiveWindow
                  if (r != null && r.packageName?.toString() == Bot.targetPackage) return r
                  return null
              }

              private fun clickNav(root: AccessibilityNodeInfo, id: String): Boolean {
                  if (id !in navAllowed) { BotLog.w("拒绝点击非白名单控件: $id"); return false }
                  val list = root.findAccessibilityNodeInfosByViewId(Bot.targetPackage + ":id/" + id)
                  if (list == null || list.isEmpty()) return false
                  var n: AccessibilityNodeInfo? = list[0]
                  var depth = 0
                  while (n != null && !n.isClickable && depth < 4) { n = n.parent; depth++ }
                  if (n == null) return false
                  return n.performAction(AccessibilityNodeInfo.ACTION_CLICK)
              }

              private fun openOrderPage(root: AccessibilityNodeInfo) {
                  val now = SystemClock.elapsedRealtime()
                  if (now - lastNav < 3000) { Paper.noPrice("等待订单页打开…"); return }
                  lastNav = now
                  navFails++
                  if (navFails > 8) { Bot.safeStop("自动打开订单页失败，请手动把MT5停在XAUUSD新订单页"); return }
                  val ok = clickNav(root, "menu_chart_new_limit_order") || clickNav(root, "bottom_bar_chart")
                  Paper.noPrice(if (ok) "自动打开订单页(第" + navFails + "次)" else "找不到订单按钮，请手动打开")
              }

              private fun readTick() {
                  val root = mt5Root()
                  if (root == null) { Paper.noPrice("MT5不在屏幕上，请切到MT5或用分屏"); return }
                  val bidT = textOf(root, "bid_price")
                  val askT = textOf(root, "ask_price")
                  if (bidT == null || askT == null) { openOrderPage(root); return }
                  val sym = textOf(root, "symbol_name")
                  if (sym == null || !sym.startsWith("XAUUSD")) { Paper.noPrice("当前品种不是XAUUSD，请手动切换"); return }
                  val bid = num(bidT)
                  val ask = num(askT)
                  if (bid == null || ask == null) { Paper.noPrice("读不到买卖价"); return }
                  if (bid < 500.0 || bid > 20000.0 || ask < bid || ask - bid > 5.0) {
                      Paper.noPrice("价格异常，已忽略(" + bid + "/" + ask + ")"); return
                  }
                  navFails = 0
                  Paper.onTick(System.currentTimeMillis(), bid, ask)
              }

              fun scheduleDump(delayMs: Long) {
                  BotLog.i((delayMs / 1000).toString() + "秒后读取当前窗口，请立刻切到MT5")
                  handler.postDelayed({ dump(true) }, delayMs)
              }

              override fun onAccessibilityEvent(e: AccessibilityEvent?) {
                  e ?: return
                  val pkg = e.packageName?.toString() ?: return
                  if (pkg != lastSeenPkg) { lastSeenPkg = pkg; BotLog.i("事件来自: $pkg") }
                  if (e.eventType == AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED &&
                      pkg != "com.android.systemui") Bot.foreground = pkg

                  if (Bot.state != Bot.State.OBSERVING) return
                  if (pkg != Bot.targetPackage) return
                  val now = SystemClock.elapsedRealtime()
                  if (now - lastDump < 2000) return
                  lastDump = now
                  dump(false)
              }

              private fun dump(force: Boolean) {
                  val root = rootInActiveWindow
                  if (root == null) { BotLog.w("读不到界面(rootInActiveWindow为空，可能被屏蔽)"); return }
                  val pkg = root.packageName?.toString() ?: ""
                  if (!force && pkg != Bot.targetPackage) return
                  val sb = StringBuilder()
                  val count = intArrayOf(0)
                  walk(root, 0, sb, count)
                  BotLog.saveDump("窗口包名:" + pkg + " 节点数:" + count[0] + "\n" + sb)
                  BotLog.i("已保存界面快照 包名=" + pkg + " 节点=" + count[0])
              }

              private fun walk(n: AccessibilityNodeInfo, depth: Int, sb: StringBuilder, count: IntArray) {
                  if (count[0] >= 500 || depth > 30) return
                  count[0]++
                  val id = n.viewIdResourceName?.substringAfter(":id/")
                  val text = if (n.isPassword) "***" else n.text?.toString()?.trim()
                  val desc = n.contentDescription?.toString()?.trim()
                  val noise = id != null && id.startsWith("navigation_bar_item_")
                  if (!noise && (!text.isNullOrEmpty() || !desc.isNullOrEmpty() || (n.isClickable && id != null))) {
                      sb.append(id ?: "-")
                      if (!text.isNullOrEmpty()) sb.append(" | t=").append(text)
                      if (!desc.isNullOrEmpty()) sb.append(" | d=").append(desc)
                      if (n.isClickable) sb.append(" | 点")
                      sb.append('\n')
                  }
                  for (i in 0 until n.childCount) n.getChild(i)?.let { walk(it, depth + 1, sb, count) }
              }

              override fun onInterrupt() {
                  if (Bot.state == Bot.State.OBSERVING || Bot.state == Bot.State.PAPER) Bot.safeStop("无障碍服务被中断")
              }

              override fun onUnbind(intent: android.content.Intent?): Boolean {
                  instance = null
                  handler.removeCallbacks(ticker)
                  if (Bot.state == Bot.State.OBSERVING || Bot.state == Bot.State.PAPER) Bot.safeStop("无障碍权限被撤销")
                  return super.onUnbind(intent)
              }
          }
          ENDOFFILE
          mkdir -p DemoBot/app/src/main/java/com/example/demobot
          cat > DemoBot/app/src/main/java/com/example/demobot/BotLog.kt <<'ENDOFFILE'
          package com.example.demobot

          import android.content.Context
          import java.io.File
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          /** 本地日志，仅保存在应用私有目录。 */
          object BotLog {
              private var dir: File? = null
              private val fmt = SimpleDateFormat("HH:mm:ss", Locale.getDefault())

              fun init(c: Context) { if (dir == null) dir = File(c.filesDir, "logs").apply { mkdirs() } }
              private fun f() = dir?.let { File(it, "bot.log") }

              private fun add(level: String, msg: String) {
                  try { f()?.appendText("${fmt.format(Date())} [$level] $msg\n") } catch (_: Exception) {}
              }
              fun i(m: String) = add("I", m)
              fun w(m: String) = add("W", m)

              fun saveDump(text: String) {
                  try { dir?.let { File(it, "last_dump.txt").writeText(text) } } catch (_: Exception) {}
              }
              fun readLog(): String = try {
                  f()?.takeIf { it.exists() }?.readLines()?.takeLast(40)?.joinToString("\n") ?: "(无日志)"
              } catch (e: Exception) { "读取失败" }
              fun readDumpFull(): String = try {
                  dir?.let { File(it, "last_dump.txt") }?.takeIf { it.exists() }?.readText() ?: "(尚无界面快照)"
              } catch (e: Exception) { "读取失败" }
              fun readDump(): String = readDumpFull().take(2500)
              fun clear() { dir?.listFiles()?.forEach { it.delete() } }
          }
          ENDOFFILE
          mkdir -p DemoBot/app/src/main/java/com/example/demobot
          cat > DemoBot/app/src/main/java/com/example/demobot/Cfg.kt <<'ENDOFFILE'
          package com.example.demobot

          import android.content.Context
          import android.content.SharedPreferences

          /** 可调参数(保存在本机)。所有数值单位：美元(0.01手黄金约1盎司，价格动1美元≈盈亏1美元) */
          object Cfg {
              private var sp: SharedPreferences? = null
              fun init(c: Context) { if (sp == null) sp = c.getSharedPreferences("cfg", Context.MODE_PRIVATE) }

              fun raw(k: String): String? = sp?.getString(k, null)
              fun setRaw(k: String, v: String) { sp?.edit()?.putString(k, v)?.apply() }
              private fun d(k: String, def: Double): Double = raw(k)?.toDoubleOrNull() ?: def
              private fun put(k: String, v: Double) { setRaw(k, v.toString()) }

              var maxSpread: Double
                  get() = d("maxSpread", 0.50)
                  set(v) { put("maxSpread", v.coerceIn(0.05, 5.0)) }

              /** 模拟额外点差：用来测试策略在点差更高时还行不行 */
              var simExtra: Double
                  get() = d("simExtra", 0.0)
                  set(v) { put("simExtra", v.coerceIn(0.0, 5.0)) }

              var maxSl: Double
                  get() = d("maxSl", 3.0)
                  set(v) { put("maxSl", v.coerceIn(0.5, 10.0)) }

              var tpRatio: Double
                  get() = d("tpRatio", 1.5)
                  set(v) { put("tpRatio", v.coerceIn(1.0, 5.0)) }

              var dailyMaxLoss: Double
                  get() = d("dailyMaxLoss", 10.0)
                  set(v) { put("dailyMaxLoss", v.coerceIn(1.0, 50.0)) }

              var maxConsecLoss: Double
                  get() = d("maxConsecLoss", 3.0)
                  set(v) { put("maxConsecLoss", v.coerceIn(1.0, 10.0)) }

              var maxHoldMin: Double
                  get() = d("maxHoldMin", 30.0)
                  set(v) { put("maxHoldMin", v.coerceIn(1.0, 240.0)) }
          }
          ENDOFFILE
          mkdir -p DemoBot/app/src/main/java/com/example/demobot
          cat > DemoBot/app/src/main/java/com/example/demobot/ChartView.kt <<'ENDOFFILE'
          package com.example.demobot

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Path
          import android.view.View

          /** 简易价格走势图：显示最近的中间价，并标出持仓的入场/止损/止盈线 */
          class ChartView(c: Context) : View(c) {
              private val line = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.rgb(0, 120, 215); strokeWidth = 3f; style = Paint.Style.STROKE
              }
              private val guide = Paint(Paint.ANTI_ALIAS_FLAG).apply { strokeWidth = 2f; style = Paint.Style.STROKE }
              private val txt = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.DKGRAY; textSize = 28f }

              override fun onDraw(cv: Canvas) {
                  super.onDraw(cv)
                  cv.drawColor(Color.rgb(245, 245, 245))
                  val d = Paper.recent()
                  val w = width.toFloat()
                  val h = height.toFloat()
                  if (d.size < 2) {
                      cv.drawText("等待价格数据…", 20f, h / 2f, txt)
                      return
                  }
                  val p = Paper.pos
                  var lo = d[0]
                  var hi = d[0]
                  for (v in d) { if (v < lo) lo = v; if (v > hi) hi = v }
                  if (p != null) {
                      for (v in doubleArrayOf(p.entry, p.sl, p.tp)) { if (v < lo) lo = v; if (v > hi) hi = v }
                  }
                  if (hi - lo < 1.0) { val m = (hi + lo) / 2.0; lo = m - 0.5; hi = m + 0.5 }
                  val padTop = 40f
                  val padBot = 20f
                  fun yOf(v: Double): Float = (h - padBot - ((v - lo) / (hi - lo)).toFloat() * (h - padTop - padBot))

                  val path = Path()
                  for (i in d.indices) {
                      val x = i * (w / (d.size - 1))
                      val y = yOf(d[i])
                      if (i == 0) path.moveTo(x, y) else path.lineTo(x, y)
                  }
                  cv.drawPath(path, line)

                  if (p != null) {
                      guide.color = Color.GRAY; cv.drawLine(0f, yOf(p.entry), w, yOf(p.entry), guide)
                      guide.color = Color.RED; cv.drawLine(0f, yOf(p.sl), w, yOf(p.sl), guide)
                      guide.color = Color.rgb(0, 150, 0); cv.drawLine(0f, yOf(p.tp), w, yOf(p.tp), guide)
                      cv.drawText("SL", 8f, yOf(p.sl) - 6f, txt)
                      cv.drawText("TP", 8f, yOf(p.tp) - 6f, txt)
                  }
                  cv.drawText("现价 " + Paper.fmt(d[d.size - 1]) + "   区间 " + Paper.fmt(lo) + " ~ " + Paper.fmt(hi), 10f, 28f, txt)
              }
          }
          ENDOFFILE
          mkdir -p DemoBot/app/src/main/java/com/example/demobot
          cat > DemoBot/app/src/main/java/com/example/demobot/MainActivity.kt <<'ENDOFFILE'
          package com.example.demobot

          import android.app.Activity
          import android.content.Intent
          import android.graphics.Typeface
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.provider.Settings
          import android.text.InputType
          import android.widget.*

          class MainActivity : Activity() {
              private lateinit var status: TextView
              private lateinit var pkgInput: EditText
              private lateinit var out: TextView
              private lateinit var chart: ChartView
              private val fields = LinkedHashMap<String, EditText>()
              private val h = Handler(Looper.getMainLooper())
              private val tick = object : Runnable {
                  override fun run() { refresh(); h.postDelayed(this, 2000) }
              }

              private fun btn(label: String, onClick: () -> Unit) = Button(this).apply {
                  text = label; setOnClickListener { onClick(); refresh() }
              }

              private fun field(col: LinearLayout, label: String, key: String, value: Double) {
                  val row = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  row.addView(TextView(this).apply { text = label; textSize = 13f },
                      LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 2f))
                  val et = EditText(this).apply {
                      setText(value.toString())
                      inputType = InputType.TYPE_CLASS_NUMBER or InputType.TYPE_NUMBER_FLAG_DECIMAL
                      setSingleLine()
                  }
                  row.addView(et, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
                  col.addView(row)
                  fields[key] = et
              }

              private fun saveCfg() {
                  fun g(k: String): Double? = fields[k]?.text?.toString()?.toDoubleOrNull()
                  g("maxSpread")?.let { Cfg.maxSpread = it }
                  g("simExtra")?.let { Cfg.simExtra = it }
                  g("maxSl")?.let { Cfg.maxSl = it }
                  g("tpRatio")?.let { Cfg.tpRatio = it }
                  g("dailyMaxLoss")?.let { Cfg.dailyMaxLoss = it }
                  g("maxConsecLoss")?.let { Cfg.maxConsecLoss = it }
                  g("maxHoldMin")?.let { Cfg.maxHoldMin = it }
                  BotLog.i("参数已保存 最大点差" + Cfg.maxSpread + " 模拟点差" + Cfg.simExtra + " 最大止损" + Cfg.maxSl)
              }

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  BotLog.init(this)
                  Cfg.init(this)

                  val col = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(32, 48, 32, 32) }
                  status = TextView(this).apply { textSize = 14f; typeface = Typeface.MONOSPACE }
                  pkgInput = EditText(this).apply { hint = "目标App包名"; setText("net.metaquotes.metatrader5"); setSingleLine() }
                  out = TextView(this).apply { textSize = 11f; typeface = Typeface.MONOSPACE; setTextIsSelectable(true) }

                  col.addView(status)
                  chart = ChartView(this)
                  col.addView(chart, LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 520))
                  val row = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                  fun rb(label: String, f: () -> Unit) {
                      row.addView(btn(label, f), LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
                  }
                  rb("▶开始") { saveCfg(); Bot.startPaper(pkgInput.text.toString()) }
                  rb("停止") { Bot.stop() }
                  rb("🛑急停") { Bot.safeStop("用户按下紧急停止") }
                  col.addView(row)
                  col.addView(out)
                  col.addView(pkgInput)
                  col.addView(TextView(this).apply { text = "—— 参数(美元) ——"; textSize = 13f })
                  field(col, "最大允许点差", "maxSpread", Cfg.maxSpread)
                  field(col, "模拟额外点差", "simExtra", Cfg.simExtra)
                  field(col, "每单最大止损", "maxSl", Cfg.maxSl)
                  field(col, "止盈/止损倍数", "tpRatio", Cfg.tpRatio)
                  field(col, "每天最大亏损", "dailyMaxLoss", Cfg.dailyMaxLoss)
                  field(col, "连亏上限(单)", "maxConsecLoss", Cfg.maxConsecLoss)
                  field(col, "最长持仓(分钟)", "maxHoldMin", Cfg.maxHoldMin)
                  col.addView(btn("💾 保存参数") { saveCfg() })
                  col.addView(btn("1. 打开无障碍设置") { startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) })
                  col.addView(btn("确认恢复(仅SAFE_STOP后)") { Bot.confirmRecover() })
                  col.addView(btn("2. 开始观察(只读快照)") { Bot.start(pkgInput.text.toString()) })
                  col.addView(btn("★ 6秒后读取当前窗口") {
                      val s = BotAccessibilityService.instance
                      if (s == null) BotLog.w("无障碍服务未运行，请把无障碍关掉再开一次") else s.scheduleDump(6000)
                  })
                  col.addView(btn("📋 复制完整快照") {
                      val cm = getSystemService(CLIPBOARD_SERVICE) as android.content.ClipboardManager
                      cm.setPrimaryClip(android.content.ClipData.newPlainText("dump", BotLog.readDumpFull()))
                      BotLog.i("完整快照已复制到剪贴板")
                  })
                  col.addView(btn("📤 分享快照") {
                      val i = Intent(Intent.ACTION_SEND).apply { type = "text/plain"; putExtra(Intent.EXTRA_TEXT, BotLog.readDumpFull()) }
                      startActivity(Intent.createChooser(i, "分享快照"))
                  })
                  col.addView(btn("清除日志") { BotLog.clear() })
                  setContentView(ScrollView(this).apply { addView(col) })
              }

              override fun onResume() { super.onResume(); h.post(tick) }
              override fun onPause() { super.onPause(); h.removeCallbacks(tick) }

              private fun a11yOn(): Boolean {
                  val s = Settings.Secure.getString(contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES) ?: ""
                  return s.contains("$packageName/")
              }

              private fun refresh() {
                  status.text = buildString {
                      append("版本: 0.5 自动开页+走势图\n")
                      append("模式: DEMO 锁定(禁止真实交易)\n")
                      append("状态: ${Bot.state}\n")
                      if (Bot.stopReason.isNotEmpty()) append("停止原因: ${Bot.stopReason}\n")
                      append("无障碍: ${if (a11yOn()) "已开启" else "未开启"} / 服务运行: ${if (BotAccessibilityService.instance != null) "是" else "否"}\n")
                      append("前台App: ${Bot.foreground.ifEmpty { "-" }}\n")
                      if (Bot.state == Bot.State.PAPER || Paper.trades > 0) append("\n" + Paper.summary())
                  }
                  chart.invalidate()
                  out.text = "—— 日志 ——\n${BotLog.readLog()}\n\n—— 最近界面快照 ——\n${BotLog.readDump()}"
              }
          }
          ENDOFFILE
          mkdir -p DemoBot/app/src/main/java/com/example/demobot
          cat > DemoBot/app/src/main/java/com/example/demobot/Paper.kt <<'ENDOFFILE'
          package com.example.demobot

          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          /**
           * 纸上交易引擎(第一版策略)：只判断、假想成交，不点击。
           * 原则：先算成本再谈盈利；点差高、波动小、方向不明就观望；每单必带止损。
           */
          object Paper {
              class Tick(val t: Long, val bid: Double, val ask: Double) {
                  val mid: Double get() = (bid + ask) / 2.0
              }
              class Pos(val buy: Boolean, val entry: Double, val sl: Double, val tp: Double, val t: Long)

              private val ticks = ArrayList<Tick>()
              private var emaF = 0.0
              private var emaS = 0.0
              private var emaInit = false
              private var lastExitT = 0L
              private var prevTickT = 0L

              var pos: Pos? = null
              var reason = "等待数据"
              var lastBid = 0.0
              var lastAsk = 0.0
              var trades = 0
              var wins = 0
              var net = 0.0
              private var peak = 0.0
              private var maxDD = 0.0
              var dayPnl = 0.0
              var consec = 0

              fun fmt(v: Double): String = String.format(Locale.US, "%.2f", v)

              fun reset() {
                  ticks.clear(); emaInit = false; pos = null; lastExitT = 0L; prevTickT = 0L
                  trades = 0; wins = 0; net = 0.0; peak = 0.0; maxDD = 0.0
                  reason = "等待数据"
                  rollDay()
              }

              private fun rollDay() {
                  val today = SimpleDateFormat("yyyyMMdd", Locale.US).format(Date())
                  if (Cfg.raw("day") != today) {
                      Cfg.setRaw("day", today); Cfg.setRaw("dayPnl", "0"); Cfg.setRaw("consec", "0")
                  }
                  dayPnl = Cfg.raw("dayPnl")?.toDoubleOrNull() ?: 0.0
                  consec = Cfg.raw("consec")?.toIntOrNull() ?: 0
              }

              /** 最近最多600个中间价，给界面画图用 */
              fun recent(): DoubleArray {
                  val n = ticks.size
                  val k = if (n > 600) 600 else n
                  return DoubleArray(k) { ticks[n - k + it].mid }
              }

              fun noPrice(why: String) { reason = why }

              fun onTick(t: Long, bid: Double, ask: Double) {
                  rollDay()
                  lastBid = bid; lastAsk = ask
                  val tk = Tick(t, bid, ask)
                  ticks.add(tk)
                  if (ticks.size > 1800) ticks.removeAt(0)
                  if (!emaInit) { emaF = tk.mid; emaS = tk.mid; emaInit = true }
                  else {
                      emaF += (tk.mid - emaF) * (2.0 / 31.0)
                      emaS += (tk.mid - emaS) * (2.0 / 181.0)
                  }
                  val gap = if (prevTickT == 0L) 0L else t - prevTickT
                  prevTickT = t
                  val p = pos
                  if (p != null) manage(p, tk, gap) else decide(tk)
              }

              private fun manage(p: Pos, tk: Tick, gap: Long) {
                  val h = Cfg.simExtra / 2.0
                  val exitPx = if (p.buy) tk.bid - h else tk.ask + h
                  if (gap > 60000L) { close(p, exitPx, "数据中断", tk.t); return }
                  if (p.buy && exitPx <= p.sl) { close(p, exitPx, "止损", tk.t); return }
                  if (!p.buy && exitPx >= p.sl) { close(p, exitPx, "止损", tk.t); return }
                  if (p.buy && exitPx >= p.tp) { close(p, p.tp, "止盈", tk.t); return }
                  if (!p.buy && exitPx <= p.tp) { close(p, p.tp, "止盈", tk.t); return }
                  if (tk.t - p.t > (Cfg.maxHoldMin * 60000.0).toLong()) { close(p, exitPx, "超时", tk.t); return }
                  reason = "持仓中"
              }

              private fun close(p: Pos, px: Double, why: String, t: Long) {
                  val pnl = if (p.buy) px - p.entry else p.entry - px
                  pos = null
                  lastExitT = t
                  trades++
                  if (pnl > 0) wins++
                  net += pnl
                  if (net > peak) peak = net
                  if (peak - net > maxDD) maxDD = peak - net
                  dayPnl += pnl
                  Cfg.setRaw("dayPnl", dayPnl.toString())
                  consec = if (pnl < 0) consec + 1 else 0
                  Cfg.setRaw("consec", consec.toString())
                  BotLog.i("纸上平仓 " + (if (p.buy) "买" else "卖") + " 入" + fmt(p.entry) + " 出" + fmt(px) +
                      " " + why + " 盈亏" + fmt(pnl) + " 累计" + fmt(net))
              }

              private fun decide(tk: Tick) {
                  if (dayPnl <= -Cfg.dailyMaxLoss) { reason = "今日亏损已达上限，不再开单"; return }
                  if (consec >= Cfg.maxConsecLoss.toInt()) { reason = "连续亏损${consec}单，今日不再开单"; return }

                  val eff = (tk.ask - tk.bid) + Cfg.simExtra
                  if (eff > Cfg.maxSpread) { reason = "点差" + fmt(eff) + "高于上限" + fmt(Cfg.maxSpread) + "，观望"; return }

                  val n = ticks.size
                  if (n < 300) { reason = "攒数据中 $n/300 秒"; return }
                  if (tk.t - lastExitT < 120000L) { reason = "刚平仓，冷却中"; return }
                  val w = ticks.subList(n - 300, n)
                  if (tk.t - w[0].t > 420000L) { reason = "数据不连续，观望"; return }

                  var hi = w[0].mid
                  var lo = w[0].mid
                  for (x in w) { if (x.mid > hi) hi = x.mid; if (x.mid < lo) lo = x.mid }
                  val range = hi - lo
                  if (range < 3.0) { reason = "5分钟波动太小(" + fmt(range) + ")，观望"; return }
                  if (range > 25.0) { reason = "波动过大(" + fmt(range) + ")，观望"; return }

                  val mid = tk.mid
                  val mom = mid - ticks[n - 61].mid
                  val trend = emaF - emaS
                  val up = trend >= 0.6 && mom >= 0.8 && mid > emaF
                  val down = trend <= -0.6 && mom <= -0.8 && mid < emaF
                  if (!up && !down) { reason = "方向不明确，观望"; return }
                  if (Math.abs(mid - emaS) > range * 0.6) { reason = "价格已走远，不追，观望"; return }

                  var slDist = range * 0.35
                  if (slDist < 1.5) slDist = 1.5
                  if (slDist > Cfg.maxSl) slDist = Cfg.maxSl
                  if (slDist < eff * 3.0) { reason = "止损距离相对点差太小，观望"; return }
                  val tpDist = slDist * Cfg.tpRatio
                  if (eff > tpDist * 0.2) { reason = "点差占止盈比例过高，观望"; return }

                  val h = Cfg.simExtra / 2.0
                  val buy = up
                  val entry = if (buy) tk.ask + h else tk.bid - h
                  val sl = if (buy) entry - slDist else entry + slDist
                  val tp = if (buy) entry + tpDist else entry - tpDist
                  pos = Pos(buy, entry, sl, tp, tk.t)
                  reason = "已开仓"
                  BotLog.i("纸上开仓 " + (if (buy) "买" else "卖") + " 价" + fmt(entry) + " 止损" + fmt(sl) + " 止盈" + fmt(tp))
              }

              fun summary(): String {
                  val wr = if (trades > 0) wins * 100 / trades else 0
                  val p = pos
                  val ps = if (p == null) "无" else
                      (if (p.buy) "买" else "卖") + "@" + fmt(p.entry) + " SL" + fmt(p.sl) + " TP" + fmt(p.tp)
                  return "【纸上交易】" + trades + "笔 胜率" + wr + "% 累计" + fmt(net) + " 最大回撤" + fmt(maxDD) + "\n" +
                      "今日" + fmt(dayPnl) + " 连亏" + consec + "\n" +
                      "卖价" + fmt(lastBid) + " 买价" + fmt(lastAsk) + " 点差" + fmt(lastAsk - lastBid) +
                      "(+模拟" + fmt(Cfg.simExtra) + ")\n" +
                      "持仓: " + ps + "\n判断: " + reason
              }
          }
          ENDOFFILE
          mkdir -p DemoBot/app/src/main/res/values
          cat > DemoBot/app/src/main/res/values/strings.xml <<'ENDOFFILE'
          <resources>
              <string name="app_name">模拟交易机器人</string>
              <string name="a11y_desc">仅用于读取你指定的交易App界面（模拟账户），在本机记录节点信息。当前版本不执行任何点击。</string>
          </resources>
          ENDOFFILE
          mkdir -p DemoBot/app/src/main/res/xml
          cat > DemoBot/app/src/main/res/xml/accessibility_config.xml <<'ENDOFFILE'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/a11y_desc"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagReportViewIds|flagIncludeNotImportantViews|flagRetrieveInteractiveWindows"
              android:canRetrieveWindowContent="true"
